name: Testar, publicar e demonstrar deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  ci-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependências e executar testes
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest -q
      - name: Preparar nome da imagem
        id: image
        shell: bash
        run: echo "repository=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Autenticar no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Criar e publicar imagem
        env:
          IMAGE: ${{ steps.image.outputs.repository }}:${{ github.sha }}
        run: |
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
      - name: Criar cluster Kind temporário
        uses: helm/kind-action@v1.12.0
      - name: Instalar aplicação e verificar deploy
        env:
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
          IMAGE_TAG: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="$IMAGE_REPOSITORY:$IMAGE_TAG"
          docker pull "$IMAGE"
          kind load docker-image "$IMAGE" --name chart-testing
          helm upgrade --install sorteios ./helm/sorteios \
            --set-string image.repository="$IMAGE_REPOSITORY" \
            --set-string image.tag="$IMAGE_TAG" \
            --set image.pullPolicy=IfNotPresent --wait --timeout 180s
          helm status sorteios
          kubectl get pods,svc
          kubectl rollout status deployment/sorteios --timeout=180s
          kubectl port-forward service/sorteios 18000:80 > /tmp/sorteios-port-forward.log 2>&1 &
          PF_PID=$!
          trap 'kill "$PF_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18000/health; then break; fi
            if [ "$i" -eq 30 ]; then cat /tmp/sorteios-port-forward.log; exit 1; fi
            sleep 1
          done
          echo
          curl -fsS 'http://127.0.0.1:18000/sortear?min=1&max=100'
          echo
