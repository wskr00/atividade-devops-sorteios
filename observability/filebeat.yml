filebeat.inputs:
  - type: filestream
    id: sorteios-api
    paths:
      - /logs/api.jsonl
    parsers:
      - ndjson:
          target: ""
          add_error_key: true
setup.ilm.enabled: false
setup.template.enabled: false
output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]
  index: "sorteios-%{+yyyy.MM.dd}"
