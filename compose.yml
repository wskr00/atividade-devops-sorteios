services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      LOG_FILE: /logs/api.jsonl
    volumes:
      - api-logs:/logs
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.4
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:9200:9200"
    volumes:
      - elastic-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.4
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
  filebeat:
    image: docker.elastic.co/beats/filebeat:8.17.4
    user: root
    command: ["-e", "--strict.perms=false"]
    volumes:
      - ./observability/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - api-logs:/logs:ro
      - filebeat-data:/usr/share/filebeat/data
    depends_on:
      elasticsearch:
        condition: service_healthy
      api:
        condition: service_started
volumes:
  api-logs:
  elastic-data:
  filebeat-data:
